<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PopPop をブラウザで試せる公式 Playground">
  <title>PopPop Playground</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="playground.css">
</head>
<body>
  <a class="skip-link" href="#editor">エディターへ移動</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">P</span>
      <div>
        <div class="brand-line">
          <h1>PopPop</h1>
          <span id="versionBadge" class="version-badge">読み込み中…</span>
        </div>
        <p>Playground <span class="popcorn" aria-hidden="true">◌ ◦ ●</span></p>
      </div>
    </div>
    <div class="header-status">
      <span id="runtimeDot" class="status-dot loading" aria-hidden="true"></span>
      <span id="runtimeStatus">実行環境を準備しています</span>
    </div>
  </header>

  <nav class="toolbar" aria-label="実行と編集">
    <button id="runButton" class="button primary" type="button" disabled>
      <span aria-hidden="true">▶</span> 実行
      <kbd>Ctrl ↵</kbd>
    </button>
    <button id="stopButton" class="button danger" type="button" disabled>
      <span aria-hidden="true">■</span> 停止
    </button>
    <span class="toolbar-separator" aria-hidden="true"></span>
    <button id="formatButton" class="button" type="button" title="行末空白とインデントを整える">整形</button>
    <button id="copyCodeButton" class="button" type="button">コードをコピー</button>
    <button id="downloadButton" class="button" type="button">保存</button>
    <label class="button file-button">
      読み込む
      <input id="fileInput" type="file" accept=".pop,.poppop,text/plain">
    </label>
    <button id="shareButton" class="button" type="button">共有 URL</button>
    <span class="toolbar-spacer"></span>
    <button id="decreaseFontButton" class="icon-button" type="button" aria-label="文字を小さく">A−</button>
    <button id="increaseFontButton" class="icon-button" type="button" aria-label="文字を大きく">A＋</button>
    <button id="themeButton" class="icon-button" type="button" aria-label="配色を切り替える">☼</button>
  </nav>

  <main class="workspace">
    <aside class="sidebar" aria-label="レッスン、サンプル、リファレンス">
      <div class="side-tabs" role="tablist">
        <button id="examplesTab" class="side-tab active" role="tab" aria-selected="true">例</button>
        <button id="referenceTab" class="side-tab" role="tab" aria-selected="false">関数</button>
        <button id="lessonTab" class="side-tab lesson-tab" role="tab" aria-selected="false">
          ロボット君 <span id="lessonTabProgress" class="count">0/0</span>
        </button>
      </div>

      <section id="examplesPanel" class="side-panel">
        <label class="search-box">
          <span class="sr-only">コード例を検索</span>
          <input id="exampleSearch" type="search" placeholder="コード例を検索">
        </label>
        <div id="exampleList" class="card-list" aria-live="polite">
          <p class="muted">仕様書から読み込み中…</p>
        </div>
      </section>

      <section id="referencePanel" class="side-panel" hidden>
        <label class="search-box">
          <span class="sr-only">標準関数を検索</span>
          <input id="referenceSearch" type="search" placeholder="標準関数を検索">
        </label>
        <div id="referenceList" class="reference-list" aria-live="polite">
          <p class="muted">実装から読み込み中…</p>
        </div>
      </section>

      <section id="lessonPanel" class="side-panel lesson-panel" hidden>
        <div class="tutor-header">
          <div id="robotAvatar" class="robot-avatar" aria-label="ロボット君">
            <span class="robot-antenna"></span>
            <span class="robot-eye left"></span>
            <span class="robot-eye right"></span>
            <span class="robot-mouth"></span>
          </div>
          <div>
            <strong>ロボット君</strong>
            <span class="tutor-online"><i></i> レッスンできます</span>
          </div>
        </div>

        <div class="lesson-progress" aria-label="レッスン進捗">
          <div class="lesson-progress-label">
            <span>進捗</span>
            <strong id="lessonProgressText">0 / 0</strong>
          </div>
          <div class="progress-track">
            <span id="lessonProgressBar"></span>
          </div>
        </div>

        <div class="lesson-picker">
          <button id="previousLessonButton" class="lesson-arrow" type="button" aria-label="前のレッスン">← 戻る</button>
          <button id="lessonTitleButton" class="lesson-title-button" type="button">
            <span id="lessonBadge">—</span>
            <strong id="lessonTitle">準備中…</strong>
          </button>
          <button id="nextLessonButton" class="lesson-arrow" type="button" aria-label="次のレッスン">次 →</button>
        </div>

        <div class="lesson-goal"><span aria-hidden="true">◎</span><span id="lessonGoal">読み込み中…</span></div>

        <div id="lessonChat" class="lesson-chat" aria-live="polite" aria-label="ロボット君との会話"></div>

        <div class="lesson-actions">
          <button id="openLessonButton" class="button primary" type="button"><span aria-hidden="true">▶</span> はじめる</button>
          <button id="checkLessonButton" class="button lesson-check" type="button" disabled><span aria-hidden="true">✓</span> 答え合わせ</button>
          <button id="hintButton" class="button" type="button" disabled><span aria-hidden="true">💡</span> ヒント</button>
          <button id="showAnswerButton" class="button" type="button" disabled><span aria-hidden="true">👀</span> 答え</button>
        </div>
        <button id="advanceLessonButton" class="advance-lesson" type="button" hidden>
          次のレッスンへ <span aria-hidden="true">→</span>
        </button>

        <form id="lessonQuestionForm" class="lesson-question">
          <label class="sr-only" for="lessonQuestion">ロボット君に質問</label>
          <input id="lessonQuestion" placeholder="ロボット君に質問…" autocomplete="off">
          <button type="submit" aria-label="質問を送信">➤</button>
        </form>
      </section>
    </aside>

    <section class="editor-column" aria-label="コードエディター">
      <div class="pane-title">
        <span>main.pop</span>
        <span id="saveStatus" class="muted">自動保存</span>
      </div>
      <div id="editor" aria-label="PopPop コード"></div>
      <textarea id="editorFallback" aria-label="PopPop コード" spellcheck="false"></textarea>
      <div class="editor-statusbar">
        <span id="cursorStatus">行 1, 列 1</span>
        <span id="characterStatus">0 文字</span>
        <span>UTF-8</span>
        <span>PopPop</span>
      </div>
    </section>

    <section class="result-column" aria-label="実行結果">
      <div class="result-tabs" role="tablist">
        <button class="result-tab active" data-result-tab="output" role="tab" aria-selected="true">出力</button>
        <button class="result-tab" data-result-tab="diagnostics" role="tab" aria-selected="false">
          診断 <span id="diagnosticCount" class="count">0</span>
        </button>
        <button class="result-tab" data-result-tab="ast" role="tab" aria-selected="false">AST</button>
        <button id="copyResultButton" class="copy-result" type="button">コピー</button>
      </div>
      <div class="result-body">
        <pre id="outputPanel" class="result-panel" tabindex="0"><span class="muted">実行結果はここに表示されます。</span></pre>
        <pre id="diagnosticsPanel" class="result-panel" tabindex="0" hidden>構文上の問題はありません。</pre>
        <pre id="astPanel" class="result-panel" tabindex="0" hidden>実行後に構文木を表示します。</pre>
      </div>
      <form id="terminalInputForm" class="terminal-input" hidden>
        <label id="terminalPrompt" for="terminalInput">入力</label>
        <input id="terminalInput" autocomplete="off">
        <button class="button primary" type="submit">送信</button>
      </form>
      <footer class="run-meta">
        <span id="runState">待機中</span>
        <span id="runTime">— ms</span>
        <span title="実行時にリポジトリの Python ソースを直接読み込みます">実装同期: ON</span>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.5/src-min-noconflict/ace.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.5/src-min-noconflict/ext-language_tools.js"></script>
  <script src="playground.js"></script>
</body>
</html>
